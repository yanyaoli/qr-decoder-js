<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从图片中识别二维码内容">
  <title>QR Decoder · 二维码解析</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #202a27; background: #f3f4ef; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, .file-button { cursor: pointer; }
    :focus-visible { outline: 3px solid #a9cdb9; outline-offset: 3px; }
    header { height: 74px; border-bottom: 1px solid #dce2d8; background: #f9faf6; }
    .header-inner { max-width: 1100px; height: 100%; margin: auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .mark { width: 31px; height: 31px; border: 5px solid #1b5140; background: #1b5140; box-shadow: inset 0 0 0 4px #f9faf6; }
    header a { color: #566c61; text-decoration: none; font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 70px 28px 80px; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 46px); letter-spacing: -.055em; line-height: 1.2; }
    .intro { margin: 14px 0 35px; color: #64736b; font-size: 15px; line-height: 1.7; }
    .workspace { display: grid; grid-template-columns: 1.08fr .92fr; border: 1px solid #dce2d8; border-radius: 16px; background: #fff; overflow: hidden; box-shadow: 0 16px 48px #203f2e0b; }
    .input-panel, .result-panel { padding: 30px; min-width: 0; }
    .result-panel { border-left: 1px solid #e5eae2; background: #fbfcfa; }
    h2 { font-size: 16px; letter-spacing: -.02em; margin: 0 0 18px; }
    .drop { min-height: 238px; border: 1.5px dashed #afc2b3; border-radius: 10px; background: #f5f8f3; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
    .drop.dragging { border-color: #195d44; background: #eaf4e9; }
    .drop-icon { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid #cbdacd; border-radius: 12px; color: #24634a; margin-bottom: 16px; }
    .drop strong { font-size: 15px; }
    .hint { color: #78887c; font-size: 13px; line-height: 1.6; margin: 8px 0 18px; }
    .file-button, .primary { border: 0; background: #215c44; color: white; border-radius: 7px; padding: 10px 17px; font-weight: 600; font-size: 13px; }
    .file-button:hover, .primary:hover { background: #154634; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .url-label { display: block; margin: 25px 0 9px; color: #394940; font-weight: 600; font-size: 13px; }
    .url-form { display: flex; gap: 8px; }
    .url-form input { min-width: 0; flex: 1; border: 1px solid #d7e0d6; border-radius: 7px; padding: 11px 12px; color: #202a27; background: white; font-size: 13px; }
    .url-form input::placeholder { color: #9aa79e; }
    .url-form button:disabled { opacity: .55; }
    .preview { height: 195px; display: grid; place-items: center; background: #f0f3ed; border: 1px solid #e5ebe3; border-radius: 10px; color: #87968a; font-size: 13px; overflow: hidden; }
    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .result-heading { display: flex; align-items: center; justify-content: space-between; margin: 27px 0 10px; }
    .result-heading h3 { margin: 0; font-size: 13px; }
    .copy { padding: 5px 9px; border: 1px solid #dce5db; background: #fff; color: #315c43; border-radius: 5px; font-size: 12px; }
    .output { min-height: 96px; white-space: pre-wrap; overflow-wrap: anywhere; color: #263d31; font-size: 14px; line-height: 1.65; }
    .empty { color: #91a096; }
    .status { margin: 0 0 10px; font-size: 13px; color: #61756a; min-height: 20px; }
    .status.error { color: #a74436; }
    .meta { color: #87968b; font-size: 12px; line-height: 1.6; }
    .footer { margin-top: 25px; color: #87958a; font-size: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) { header { height: 64px; } main { padding: 44px 16px 50px; } .header-inner { padding: 0 16px; } .workspace { grid-template-columns: 1fr; } .input-panel, .result-panel { padding: 22px; } .result-panel { border-left: 0; border-top: 1px solid #e5eae2; } .drop { min-height: 200px; } }
  </style>
</head>
<body>
  <header><div class="header-inner"><div class="brand"><span class="mark" aria-hidden="true"></span>QR Decoder</div><a href="https://github.com/yanyaoli/qr-decoder-js" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div></header>
  <main>
    <h1>识别二维码</h1>
    <p class="intro">上传、粘贴图片或输入图片链接，查看二维码内容。</p>
    <div class="workspace">
      <section class="input-panel" aria-labelledby="input-heading">
        <h2 id="input-heading">选择图片</h2>
        <div class="drop" id="drop-zone">
          <div class="drop-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V4m-4 4 4-4 4 4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></div>
          <strong>拖放图片到这里</strong>
          <p class="hint">也可以直接按 Ctrl / ⌘ + V 粘贴图片</p>
          <label class="file-button">选择本地图片<input id="file-input" type="file" accept="image/*"></label>
        </div>
        <form id="url-form">
          <label class="url-label" for="image-url">图片链接</label>
          <div class="url-form"><input id="image-url" type="url" placeholder="https://example.com/image.png" required><button class="primary" type="submit">解析链接</button></div>
        </form>
        <p class="footer">图片在浏览器中解析，图片链接需要允许跨域访问。</p>
      </section>
      <section class="result-panel" aria-labelledby="result-heading">
        <h2 id="result-heading">识别结果</h2>
        <div class="preview"><span id="preview-placeholder">图片预览</span><img id="preview" alt="待识别图片预览" hidden></div>
        <div class="result-heading"><h3>内容</h3><button id="copy" class="copy" type="button" hidden>复制</button></div>
        <p id="status" class="status" role="status" aria-live="polite">等待图片</p>
        <div id="output" class="output empty">识别结果将显示在这里</div>
        <div id="meta" class="meta"></div>
      </section>
    </div>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
